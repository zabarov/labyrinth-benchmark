name: Offline conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=moderate
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pull and resolve test-only image
        run: |
          docker pull python:3.12-alpine
          echo "LABYRINTH_SANDBOX_IMAGE=$(docker image inspect python:3.12-alpine --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - run: node --test test/sandbox.integration.mjs
